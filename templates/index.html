<!DOCTYPE html>
<html>
<head>
<title>KerrzAI 💰</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#1a1a2e,#16213e);
  color: white;
  padding: 10px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(2,1fr);
  gap:10px;
}

.card {
  background: linear-gradient(135deg,#ffb6c1,#ffc0cb);
  color:black;
  padding:15px;
  border-radius:20px;
  cursor:pointer;
}

.trade-box {
  margin-top:15px;
  padding:15px;
  background:#fff0f5;
  color:black;
  border-radius:15px;
}

.dashboard {
  display:flex;
  justify-content:space-around;
  background:#ffe4e1;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  color:black;
}
</style>
</head>

<body>

<h2>KerrzAI Scanner 🤖</h2>

<div id="grid" class="grid"></div>

<div id="tradeBox" class="trade-box">
Click a pair 👆
</div>

<div class="dashboard">
<div>Wins: <span id="wins">0</span></div>
<div>Loss: <span id="loss">0</span></div>
<div>Confidence: <span id="conf">0%</span></div>
</div>

<script>

async function loadScanner(){
  const res = await fetch('/scan');
  const data = await res.json();

  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  Object.keys(data).forEach(pair => {

    let d = data[pair];

    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>${pair}</h3>
      <p>${d.signal}</p>
      <p>${d.trend}</p>
      <p>${d.confidence}%</p>
    `;

    card.onclick = () => showTrade(pair, d);

    grid.appendChild(card);
  });
}

function showTrade(pair, d){
  document.getElementById("tradeBox").innerHTML = `
    <h2>${pair}</h2>
    <p>Trend: ${d.trend}</p>
    <p>Signal: ${d.signal}</p>
    <p>Entry: ${d.entry}</p>
    <p>TP: ${d.tp}</p>
    <p>SL: ${d.sl}</p>
    <p>BOS: ${d.bos}</p>
    <p>Confidence: ${d.confidence}%</p>
  `;

  document.getElementById("conf").innerText = d.confidence + "%";
}

setInterval(loadScanner, 5000);
loadScanner();

</script>

</body>
</html>
