<!DOCTYPE html>
<html>
<head>
<title>KerrzAI Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b132b;
    color: white;
}

/* GRID */
.pairs-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 10px;
}

/* CARDS */
.pair-card {
    background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
    padding: 15px;
    border-radius: 20px;
    cursor: pointer;
    color: black;
}

.pair-card:hover {
    transform: scale(1.05);
}

.trade-box {
    margin: 20px;
    padding: 20px;
    background: #fff0f5;
    border-radius: 20px;
    color: black;
}

/* DASHBOARD */
.dashboard {
    display: flex;
    justify-content: space-around;
    background: #ffe4e1;
    padding: 15px;
    border-radius: 15px;
    margin: 20px;
    color: black;
}

/* MAIN CARD */
.card {
    background: #1c2541;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.buy { background: rgba(0,255,0,0.2); }
.sell { background: rgba(255,0,0,0.2); }

canvas { margin-top: 15px; }

.btn {
    padding: 10px;
    margin: 5px;
    border: none;
    border-radius: 8px;
}

.buy-btn { background: green; color: white; }
.sell-btn { background: red; color: white; }

</style>
</head>

<body>

<h2>📊 Market Scanner</h2>

<div class="pairs-grid">
  <div class="pair-card" onclick="openPair('Volatility 10')">Volatility 10</div>
  <div class="pair-card" onclick="openPair('Volatility 25')">Volatility 25</div>
  <div class="pair-card" onclick="openPair('Volatility 75')">Volatility 75</div>
</div>

<!-- TRADE BOX -->
<div id="tradeBox" class="trade-box">
  <h2>Select a pair</h2>
</div>

<!-- MAIN AI CARD -->
<div class="card" id="card">
    <h2 id="signal">Loading...</h2>
    <p id="rsi"></p>
    <canvas id="chart"></canvas>

    <button class="btn buy-btn">BUY</button>
    <button class="btn sell-btn">SELL</button>
</div>

<!-- DASHBOARD -->
<h2>📈 Performance</h2>
<div class="dashboard">
  <div>Wins: 0</div>
  <div>Losses: 0</div>
  <div>Live: 1</div>
</div>

<script>

// CLICKABLE PAIRS
function openPair(pair) {

  const data = {
    "Volatility 10": {trend:"UPTREND", entry:"1234", tp:"1250", sl:"1200", signal:"BUY"},
    "Volatility 25": {trend:"DOWNTREND", entry:"5432", tp:"5300", sl:"5500", signal:"SELL"},
    "Volatility 75": {trend:"RANGE", entry:"--", tp:"--", sl:"--", signal:"WAIT"}
  };

  let d = data[pair];

  document.getElementById("tradeBox").innerHTML = `
    <h2>${pair}</h2>
    <p>Trend: ${d.trend}</p>
    <p>Signal: ${d.signal}</p>
    <p>Entry: ${d.entry}</p>
    <p>TP: ${d.tp}</p>
    <p>SL: ${d.sl}</p>
  `;
}

// FAKE CHART DATA (replace later with real API)
let chart;

function loadData() {
    let prices = Array.from({length: 20}, () => Math.random() * 100);

    document.getElementById("signal").innerText = "AI SCANNING...";
    document.getElementById("rsi").innerText = "RSI: 50";

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: prices.map((_, i) => i),
            datasets: [{
                data: prices,
                borderWidth: 2
            }]
        }
    });
}

setInterval(loadData, 3000);
loadData();

</script>

</body>
</html>
