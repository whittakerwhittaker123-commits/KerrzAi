<!DOCTYPE html>
<html>
<head>
    <title>KerrzAI Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b132b;
            color: white;
        }

        .container {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 30%;
            max-width: 200px;
            background: #1c2541;
            padding: 15px;
        }

        .sidebar h3 {
            margin-bottom: 10px;
        }

        .pair-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #3a506b;
            border: none;
            color: white;
            border-radius: 6px;
        }

        .pair-btn.active {
            background: #5bc0be;
        }

        /* Main */
        .main {
            flex: 1;
            padding: 15px;
        }

        .card {
            background: #1c2541;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .buy {
            background: rgba(0,255,0,0.15);
        }

        .sell {
            background: rgba(255,0,0,0.15);
        }

        canvas {
            margin-top: 15px;
        }

        .buttons {
            margin-top: 15px;
        }

        .btn {
            width: 45%;
            padding: 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .buy-btn {
            background: green;
            color: white;
        }

        .sell-btn {
            background: red;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="option">
    Account:
    <select id="accountType">
        <option value="demo">Demo</option>
        <option value="real">Real</option>
    </select>
</div>
        <h3>Pairs</h3>

        <button class="pair-btn active" onclick="setPair('R_100', this)">R_100</button>
        <button class="pair-btn" onclick="setPair('R_50', this)">R_50</button>
        <button class="pair-btn" onclick="setPair('R_25', this)">R_25</button>
        <button class="pair-btn" onclick="setPair('R_10', this)">R_10</button>
        <button class="pair-btn" onclick="setPair('R_75', this)">R_75</button>
    </div>
;
    <!-- Main -->
    <div class="main">

        <h2>KerrzAI 🤖</h2>

        <div id="card" class="card">
            <h2 id="signal">Loading...</h2>
            <p id="rsi"></p>

            <canvas id="chart"></canvas>

            <div class="buttons">
                <button class="btn buy-btn">BUY</button>
                <button class="btn sell-btn">SELL</button>
            </div>
        </div>

    </div>

</div>

<script>
let currentPair = "R_100";
let chart;

function setPair(pair, el) {
    currentPair = pair;

    document.querySelectorAll(".pair-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    el.classList.add("active");
}

async function loadData() {
    try {
        const res = await fetch(`/signal?symbol=${currentPair}`);
        const data = await res.json();

        if (data.error) {
            document.getElementById("signal").innerText = "Waiting...";
            return;
        }

        document.getElementById("signal").innerText = data.signal;
        document.getElementById("rsi").innerText = "RSI: " + data.rsi;

        const card = document.getElementById("card");
        card.classList.remove("buy", "sell");

        if (data.signal === "BUY") {
            card.classList.add("buy");
        } else if (data.signal === "SELL") {
            card.classList.add("sell");
        }

        if (chart) chart.destroy();

        chart = new Chart(document.getElementById("chart"), {
            type: "line",
            data: {
                labels: data.prices.map((_, i) => i),
                datasets: [{
                    data: data.prices,
                    borderWidth: 2,
                    fill: true
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { x: { display: false } }
            }
        });

    } catch {
        document.getElementById("signal").innerText = "Error";
    }
}

setInterval(loadData, 3000);
loadData();
    <script>
const TOKENS = {
    demo: "***********hZzp",
    real: "PASTE_REAL_TOKEN_HERE"
};
</script>
</script>

</body>
</html>
