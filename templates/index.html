<script>
let chart;

async function loadData() {
    const symbol = document.getElementById("symbol").value;

    try {
        const res = await fetch(`/signal?symbol=${symbol}`);
        const data = await res.json();

        // ✅ HANDLE ERROR
        if (data.error) {
            document.getElementById("signal").innerText = "Waiting for data...";
            document.getElementById("rsi").innerText = "";
            return;
        }

        const prices = data.prices;

        document.getElementById("signal").innerText = data.signal;
        document.getElementById("rsi").innerText = "RSI: " + data.rsi;

        const card = document.getElementById("card");
        card.classList.remove("buy", "sell");

        if (data.signal === "BUY") {
            card.classList.add("buy");
        } else if (data.signal === "SELL") {
            card.classList.add("sell");
        }

        if (chart) chart.destroy();

        chart = new Chart(document.getElementById("chart"), {
            type: "line",
            data: {
                labels: prices.map((_, i) => i),
                datasets: [{
                    data: prices,
                    fill: true,
                    borderWidth: 2
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { x: { display: false } }
            }
        });

    } catch (err) {
        document.getElementById("signal").innerText = "Connection error";
    }
}

setInterval(loadData, 4000);
loadData();
</script>
