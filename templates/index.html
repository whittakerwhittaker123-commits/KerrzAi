<!DOCTYPE html>
<html>
<head>
<title>KerrzAI 💰</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#1a1a2e,#16213e);
  color: white;
  padding: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.card {
  background: linear-gradient(135deg,#ffb6c1,#ffc0cb);
  color: black;
  padding: 15px;
  border-radius: 20px;
  cursor: pointer;
}

.buy { border-left: 6px solid green; }
.sell { border-left: 6px solid red; }
.wait { border-left: 6px solid orange; }

.trade-box {
  margin-top: 20px;
  padding: 20px;
  background: #fff0f5;
  color: black;
  border-radius: 20px;
}

.dashboard {
  display: flex;
  justify-content: space-around;
  background: #ffe4e1;
  padding: 12px;
  border-radius: 15px;
  margin-top: 15px;
  color: black;
}
</style>
</head>

<body>

<h2>KerrzAI Scanner 🤖</h2>

<div id="grid" class="grid"></div>

<div id="tradeBox" class="trade-box">
Click a pair 👇
</div>

<div class="dashboard">
  <div>Wins: <span id="wins">0</span></div>
  <div>Loss: <span id="loss">0</span></div>
  <div>Confidence: <span id="conf">0%</span></div>
</div>

<script>

async function loadScanner(){
  try {
    const res = await fetch('/scan');
    const data = await res.json();

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    Object.keys(data).forEach(pair => {

      let d = data[pair];

      let type = "wait";
      if (d.signal.includes("BUY")) type = "buy";
      if (d.signal.includes("SELL")) type = "sell";

      let card = document.createElement("div");
      card.className = "card " + type;

      card.innerHTML = `
        <h3>${pair}</h3>
        <p><b>${d.signal}</b></p>
        <p>${d.trend}</p>
        <p>${d.confidence}%</p>
      `;

      card.onclick = () => showTrade(pair, d);

      grid.appendChild(card);
    });

  } catch (err) {
    console.log("Error loading scanner");
  }
}

function showTrade(pair, d){
  document.getElementById("tradeBox").innerHTML = `
    <h2>${pair}</h2>
    <p><b>Trend:</b> ${d.trend}</p>
    <p><b>Signal:</b> ${d.signal}</p>

    <hr>

    <p><b>Entry:</b> ${d.entry}</p>
    <p><b>TP:</b> ${d.tp}</p>
    <p><b>SL:</b> ${d.sl}</p>

    <hr>

    <p><b>BOS:</b> ${d.bos}</p>
    <p><b>Confidence:</b> ${d.confidence}%</p>
  `;

  document.getElementById("conf").innerText = d.confidence + "%";
}

setInterval(loadScanner, 4000);
loadScanner();

</script>

</body>
</html>
