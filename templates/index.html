<!DOCTYPE html>
<html>
<head>
<title>KerrzAI 💰</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Bold;
  background: linear-gradient(135deg,#1a1a2e,#16213e);
  color: pink;
  padding: 15px;
  .login-box {
  background: #fff0f5;
  color: black;
  padding: 15px;
  border-radius: 20px;
  margin-bottom: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.login-box input, .login-box select {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  border: none;
}

.login-box button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  background: #16213e;
  color: white;
  border: none;
  border-radius: 10px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

/* CARDS */
.card {
  background: linear-gradient(135deg,#ffb6c1,#ffc0cb);
  color: black;
  padding: 15px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.card:hover {
  transform: scale(1.05);
}

.buy { border-left: 6px solid green; }
.sell { border-left: 6px solid red; }
.wait { border-left: 6px solid orange; }

/* TRADE BOX */
.trade-box {
  margin-top: 20px;
  padding: 20px;
  background: #fff0f5;
  color: black;
  border-radius: 20px;
}

/* DASHBOARD */
.dashboard {
  display: flex;
  justify-content: space-around;
  background: #ffe4e1;
  padding: 12px;
  border-radius: 15px;
  margin-top: 15px;
  color: black;
  font-weight: bold;
}

/* 🔥 PRO PANEL */
.pro-panel {
  margin-top: 20px;
  padding: 15px;
  background: #ffffff;
  color: black;
  border-radius: 15px;
}

.pro-panel h3 {
  margin-top: 10px;
}

.pro-panel label {
  display: block;
  margin: 5px 0;
}

.pro-panel select,
.pro-panel input {
  width: 100%;
  margin-bottom: 10px;
}
</style>
  <style>
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.box {
    background: #e7a9ad;
    padding: 15px;
    border-radius: 15px;
    color: black;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<h2>KerrzAI Scanner 🤖</h2>

<!-- 🔥 PAIRS -->
  <!-- 🔐 DERIV LOGIN PANEL -->
<div class="login-box">
  <div class="trade-box">

  <h3>🔐 Connect Deriv</h3>

  <!-- Account Type -->
  <select id="accountType" style="width:100%;padding:10px;margin-bottom:10px;">
    <option value="demo">Demo</option>
    <option value="real">Real</option>
  </select>

  <!-- Token Input -->
  <input 
    id="tokenInput" 
    placeholder="Enter Deriv token"
    style="width:100%;padding:10px;margin-bottom:10px;border-radius:10px;border:none;"
  >

  <!-- ✅ CONNECT BUTTON -->
  <button onclick="connectDeriv()" style="
    width:100%;
    padding:12px;
    background:#16213e;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:bold;
  ">
    Connect
  </button>

  <!-- ✅ STATUS TEXT -->
  <p id="status" style="margin-top:10px;">Not connected</p>

</div>

<!-- 🔥 TRADE DETAILS -->
<div id="tradeBox" class="trade-box">
  
  Click a pair
<p>Click a pair 👇</p>
<div id="pairsContainer" class="grid"></div>
  <div id="pairsContainer" class="grid"></div>
</div>

<!-- 🔥 DASHBOARD -->
<div class="dashboard">
  <div>Wins: <span id="wins">0</span></div>
  <div>Loss: <span id="loss">0</span></div>
  <div>Confidence: <span id="conf">0%</span></div>
</div>

<!-- 🔥 NEW PRO UI -->
<div class="pro-panel">

  <h3>⚙️ AI Settings</h3>

  <label>Mode:</label>
  <select id="mode">
    <option>Sniper</option>
    <option>Scalper</option>
    <option>Smart Money</option>
  </select>

  <label>Min Confidence:</label>
  <input type="range" id="minConf" min="50" max="95" value="70">
  <span id="confVal">70%</span>

  <hr>

  <h3>📊 Filters</h3>

  <label><input type="checkbox" checked> EMA Trend</label>
  <label><input type="checkbox" checked> RSI Strength</label>
  <label><input type="checkbox" checked> ATR Volatility</label>
  <label><input type="checkbox" checked> BOS / Liquidity</label>

  <hr>

  <h3>🔔 Alerts</h3>

  <label><input type="checkbox"> Popup Alerts</label>
  <label><input type="checkbox"> Sound Alerts</label>

</div>

<script>

// ===============================
// 📡 LOAD SCANNER
// ===============================
async function loadScanner(){
    try {
        const res = await fetch('/scan');
        const data = await res.json();

        let grid = document.getElementById("grid");
        grid.innerHTML = "";

        Object.keys(data).forEach(pair => {
            let d = data[pair];

            let card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <h3>${pair}</h3>
                <p>${d.signal}</p>
                <p>${d.trend}</p>
                <p>${d.confidence}%</p>
            `;

            grid.appendChild(card);
        });

    } catch (err) {
        console.log("Error loading scanner");
    }
}



// ===============================
// 📊 SHOW TRADE
// ===============================
function showTrade(pair, d){

  document.getElementById("tradeBox").innerHTML = `
    <h2>${pair}</h2>

    <p><b>Trend:</b> ${d.trend || "-"}</p>
    <p><b>Signal:</b> ${d.signal || "-"}</p>

    <hr>

    <p>Entry: ${d.entry || 0}</p>
<p>TP: ${d.tp || 0}</p>
<p>SL: ${d.sl || 0}</p>

    <hr>

    <p><b>BOS:</b> ${d.bos || "-"}</p>
    <p><b>Confidence:</b> ${d.confidence || 0}%</p>
  `;

  document.getElementById("conf").innerText = (d.confidence || 0) + "%";
}


// ===============================
// 🎛 SLIDER UPDATE
// ===============================
document.getElementById("minConf").addEventListener("input", (e) => {
  document.getElementById("confVal").innerText = e.target.value + "%";
});


// ===============================
// 🔄 AUTO REFRESH
// ===============================
function connectAccount() {
  const token = document.getElementById("tokenInput").value;
  const type = document.getElementById("accountType").value;

  fetch("/connect", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      token: token,
      type: type
    })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("loginStatus").innerText =
      "✅ Connected: " + data.balance + " " + data.currency;
  })
  .catch(() => {
    document.getElementById("loginStatus").innerText = "❌ Failed";
  });
}
  setInterval(loadScanner, 4000);
loadScanner();
async function loadScanner(){

  // ===============================
// 🔐 CONNECT TO DERIV (✅ OUTSIDE)
// ===============================
async function connectDeriv() {

    const token = document.getElementById("tokenInput").value;

    const res = await fetch("/connect", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ token: token })
    });

    const data = await res.json();

    console.log("CONNECT RESPONSE:", data);

    if (data.error) {
        document.getElementById("status").innerText = "❌ Failed to connect";
        return;
    }

    document.getElementById("status").innerText =
        `✅ Connected: ${data.loginid} | ${data.balance} ${data.currency}`;
}

}
</script>
<script>
async function loadPairs() {
    const res = await fetch("/scan");
    const data = await res.json();

    const container = document.getElementById("pairsContainer");
    container.innerHTML = "";

    for (const pair in data) {
        const d = data[pair];

        const box = document.createElement("div");
        box.className = "box";

        box.innerHTML = `
            <h3>${pair}</h3>
            <p>${d.signal}</p>
            <p>${d.trend}</p>
            <p>Entry: ${d.entry || 0}</p>
            <p>TP: ${d.tp || 0}</p>
            <p>SL: ${d.sl || 0}</p>
            <p>${d.confidence || 0}%</p>
        `;

        container.appendChild(box);
    }
}

setInterval(loadPairs, 3000);
loadPairs();
</script>
</body>
</html>
