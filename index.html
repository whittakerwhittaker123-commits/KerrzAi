<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// Chart setup
const ctx = document.getElementById('chart');
let chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'Price',
            data: [],
            borderColor: '#38bdf8',
            borderWidth: 2
        }]
    },
    options: {
        scales: {
            x: { display: false }
        }
    }
});

// DERIV WS
const ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

let prices = [];

ws.onopen = () => {
    ws.send(JSON.stringify({ ticks: "R_100" }));
};

ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if (data.tick) {
        const price = data.tick.quote;

        // store prices
        prices.push(price);
        if (prices.length > 30) prices.shift();

        // update chart
        chart.data.labels.push("");
        chart.data.datasets[0].data.push(price);

        if (chart.data.labels.length > 30) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
        }

        chart.update();

        // RSI
        if (prices.length >= 14) {
            const rsi = calculateRSI(prices);
            document.getElementById("rsi").innerText = rsi.toFixed(2);

            let signal = "HOLD";
            let color = "";

            if (rsi < 30) {
                signal = "BUY";
                color = "buy-text";
            } else if (rsi > 70) {
                signal = "SELL";
                color = "sell-text";
            }

            const signalEl = document.getElementById("signal");
            signalEl.innerText = "Signal: " + signal;
            signalEl.className = color;
        }
    }
};

// RSI
function calculateRSI(prices) {
    let gains = 0, losses = 0;

    for (let i = 1; i < prices.length; i++) {
        let diff = prices[i] - prices[i-1];
        if (diff > 0) gains += diff;
        else losses -= diff;
    }

    let avgGain = gains / prices.length;
    let avgLoss = losses / prices.length;

    if (avgLoss === 0) return 100;

    let rs = avgGain / avgLoss;
    return 100 - (100 / (1 + rs));
}
</script>
