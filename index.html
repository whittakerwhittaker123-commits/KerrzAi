   <!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
body {
    background: linear-gradient(to bottom, #1e1b4b, #0b1220);
    font-family: 'Arial';
    color: white;
}

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
}

/* Cards */
.card {
    background: #fdf2f8;
    color: #111;
    padding: 12px;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    font-size: 12px;
}

/* Trend colors */
.up { border-left: 6px solid #22c55e; }
.down { border-left: 6px solid #ef4444; }
.range { border-left: 6px solid #f59e0b; }

/* Signal badge */
.badge {
    padding: 4px 8px;
    border-radius: 10px;
    font-weight: bold;
    display: inline-block;
    margin-top: 5px;
}

.buy { background: #22c55e; color: white; }
.sell { background: #ef4444; color: white; }
.wait { background: #f59e0b; color: white; }

/* 💖 Girly checkboxes */
.switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 20px;
}
.switch input {display:none;}
.slider {
  position: absolute;
  cursor: pointer;
  background: #ddd;
  border-radius: 20px;
  top: 0; left: 0; right: 0; bottom: 0;
}
.slider:before {
  position: absolute;
  content: "";
  height: 16px; width: 16px;
  left: 2px; bottom: 2px;
  background: pink;
  border-radius: 50%;
  transition: .3s;
}
input:checked + .slider {
  background: #ec4899;
}
input:checked + .slider:before {
  transform: translateX(20px);
}
</style>
</head>

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// Chart setup
const ctx = document.getElementById('chart');
let chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'Price',
            data: [],
            borderColor: '#38bdf8',
            borderWidth: 2
        }]
    },
    options: {
        scales: {
            x: { display: false }
        }
    }
});

// DERIV WS
const ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

let prices = [];

ws.onopen = () => {
    ws.send(JSON.stringify({ ticks: "R_100" }));
};

ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if (data.tick) {
        const price = data.tick.quote;

        // store prices
        prices.push(price);
        if (prices.length > 30) prices.shift();

        // update chart
        chart.data.labels.push("");
        chart.data.datasets[0].data.push(price);

        if (chart.data.labels.length > 30) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
        }

        chart.update();

        // RSI
        if (prices.length >= 14) {
            const rsi = calculateRSI(prices);
            document.getElementById("rsi").innerText = rsi.toFixed(2);

            let signal = "HOLD";
            let color = "";

            if (rsi < 30) {
                signal = "BUY";
                color = "buy-text";
            } else if (rsi > 70) {
                signal = "SELL";
                color = "sell-text";
            }

            const signalEl = document.getElementById("signal");
            signalEl.innerText = "Signal: " + signal;
            signalEl.className = color;
        }
    }
};

// RSI
function calculateRSI(prices) {
    let gains = 0, losses = 0;

    for (let i = 1; i < prices.length; i++) {
        let diff = prices[i] - prices[i-1];
        if (diff > 0) gains += diff;
        else losses -= diff;
    }

    let avgGain = gains / prices.length;
    let avgLoss = losses / prices.length;

    if (avgLoss === 0) return 100;

    let rs = avgGain / avgLoss;
    return 100 - (100 / (1 + rs));
}
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {

    const pairs = ["R_10","R_25","R_50","R_75","R_100"];
    const grid = document.getElementById("pairsGrid");

    pairs.forEach(pair => {
        let card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <h4>${pair}</h4>
            <p id="trend-${pair}">Trend: ...</p>
            <p id="rsi-${pair}">RSI: ...</p>
            <span id="signal-${pair}" class="badge wait">WAIT</span>
        `;
        grid.appendChild(card);

        startPair(pair);
    });

    function startPair(symbol) {
        let ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");
        let prices = [];

        ws.onopen = () => {
            ws.send(JSON.stringify({
                ticks: symbol,
                subscribe: 1
            }));
        };

        ws.onmessage = (msg) => {
            let data = JSON.parse(msg.data);

            if (data.tick) {
                let price = data.tick.quote;

                prices.push(price);
                if (prices.length > 20) prices.shift();

                if (prices.length >= 10) {
                    let trend = price > prices[0] ? "UP" : "DOWN";
                    let signal = trend === "UP" ? "BUY" : "SELL";

                    updateUI(symbol, trend, signal);
                }
            }
        };
    }

    function updateUI(pair, trend, signal) {
        document.getElementById(`trend-${pair}`).innerText = "Trend: " + trend;

        let badge = document.getElementById(`signal-${pair}`);
        badge.innerText = signal;
        badge.className = "badge " + signal.toLowerCase();
    }

});
</script>
